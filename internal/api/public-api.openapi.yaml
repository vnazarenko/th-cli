          nullable: true
        biography:
          type: string
          nullable: true
        profile_pic_url:
          type: string
          nullable: true
          description: Avatar URL (S3-signed). Added by the server, not an index field.
        paid:
          type: boolean
          nullable: true
          description: >
            Whether the caller's Space already owns a report for this account —
            if true, fetch it free with `GET /v1/reports/{username}` instead of
            ordering a new one.
