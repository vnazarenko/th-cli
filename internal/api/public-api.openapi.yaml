        gender:
          description: >
            Account gender as stored in the index. The `gender` FILTER uses the
            codes 0/1/2/3; this field is echoed verbatim from the index and is
            left untyped here rather than asserting a representation the spec
            author could not verify against production data.
        account_type:
          description: >
            Account type, echoed verbatim from the index. Untyped for the same
            reason as `gender`.
        instagram_category:
          type: string
          nullable: true
        contacts:
          description: >
            Contact availability, echoed verbatim from the index (the filter
            treats it as the codes 0 none / 1 email / 2 phone / 3 both).
